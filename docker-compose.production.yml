# ==============================================================================
# NKB Cloud v2.1.0 — Production Docker Compose Configuration
# Target Platform: AlmaLinux 10 Hostinger VPS (Enterprise Production Stack)
# ==============================================================================

name: nkb-cloud-production

services:
  # Isolated PostgreSQL 16 Enterprise Database
  db:
    image: postgres:16-alpine
    container_name: nkb_prod_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nkb_cloud_production}
      POSTGRES_USER: ${POSTGRES_USER:-nkb_prod_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password must be set in .env.production}
    volumes:
      - nkb_prod_pgdata:/var/lib/postgresql/data
    # SECURITY: Database port 5432 is strictly INTERNAL. Never expose to public VPS network.
    expose:
      - "5432"
    networks:
      - nkb_internal_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nkb_prod_admin} -d ${POSTGRES_DB:-nkb_cloud_production}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M

  # Express Backend API & Secure Agent Hub
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: nkb-cloud-backend:2.1.0
    container_name: nkb_prod_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      HOST: 0.0.0.0
      DATABASE_URL: postgres://${POSTGRES_USER:-nkb_prod_admin}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-nkb_cloud_production}
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-nkb_prod_admin}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-nkb_cloud_production}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env.production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      STAGING_MAINTENANCE_GATE: ${STAGING_MAINTENANCE_GATE:-false}
      STORAGE_ROOT: /app/storage
      UPLOAD_TEMP_DIR: /app/uploads
      DOWNLOAD_TEMP_DIR: /app/downloads
      LOGS_DIR: /app/logs
    volumes:
      - nkb_prod_storage:/app/storage
      - nkb_prod_uploads:/app/uploads
      - nkb_prod_logs:/app/logs
    # SECURITY: Backend port 5000 is internal. Reverse proxy handles all ingress.
    expose:
      - "5000"
    networks:
      - nkb_internal_network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.25'
          memory: 256M

  # React Frontend (Static SPA Server)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: nkb-cloud-frontend:2.1.0
    container_name: nkb_prod_frontend
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - nkb_internal_network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 64M

  # Edge Reverse Proxy with SSL Termination
  reverse_proxy:
    image: nginx:1.26.3-alpine@sha256:1eadbb07820339e8bbfed18c771691970baee292ec4ab2558f1453d26153e22d
    container_name: nkb_prod_nginx
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/nginx/ssl:ro
      - nkb_certbot_webroot:/var/www/certbot:ro
      - nkb_nginx_logs:/var/log/nginx
    ports:
      - "80:80"
      - "443:443"
    networks:
      - nkb_internal_network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 64M

networks:
  nkb_internal_network:
    driver: bridge
    internal: false

volumes:
  nkb_prod_pgdata:
    driver: local
  nkb_prod_storage:
    driver: local
  nkb_prod_uploads:
    driver: local
  nkb_prod_logs:
    driver: local
  nkb_certbot_webroot:
    driver: local
  nkb_nginx_logs:
    driver: local
